<style>
  :root {
    --white: #FFFFFF;

  }
  * { box-sizing: border-box; }
  html { background: var(--white); -webkit-text-size-adjust: 100%; }
  body {

  }

  a { color: var(--gold-deep); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--gold-line); }
  b, strong { font-weight: 600; color: var(--ink); }

  }
  .topbar {
    position: absolute; left: 0; right: 0; top: calc(12px + env(safe-area-inset-top));
    display: flex; justify-content: flex-end; padding: 0 14px;
  }
  .seg-mini { display: flex; background: rgba(255, 255, 255, .25); border-radius: 99px; padding: 3px; backdrop-filter: blur(6px); }

    font: 700 12px Inter, sans-serif; letter-spacing: 1.5px; padding: 7px 13px; border-radius: 99px;
    text-shadow: 0 1px 2px rgba(110, 80, 0, .35);

  .seg-mini button.on { background: var(--white); color: var(--gold-deep); text-shadow: none; }

  .brand {

    margin: 0; font-size: clamp(40px, 11vw, 56px); letter-spacing: .16em; line-height: 1;
    text-shadow: 0 1px 2px rgba(110, 80, 0, .45), 0 0 22px rgba(110, 80, 0, .22);
  }
  .brand-sub {
    font-family: Cinzel, Georgia, serif; font-weight: 600; color: var(--white);
    margin: 12px 0 0; font-size: 13px; letter-spacing: .32em;
    text-shadow: 0 1px 2px rgba(110, 80, 0, .45);
  }
  .rule { width: 56px; height: 1px; background: rgba(255,255,255,.75); margin: 18px auto 14px; border: 0; }
  .tagline { margin: 0 auto; max-width: 420px; font-size: 15px; color: var(--white); opacity: .96; text-shadow: 0 1px 2px rgba(110, 80, 0, .35); }

  main { max-width: 600px; margin: -44px auto 0; padding: 0 16px; position: relative; }

  /* ---------- Cartes ---------- */
  .card {
    background: var(--white); border: 1px solid var(--gold-line); border-radius: var(--radius);
    padding: 22px 20px; margin: 0 0 16px; box-shadow: var(--shadow);
  }
  .eyebrow {
    font: 700 11px Inter, sans-serif; letter-spacing: .18em; text-transform: uppercase;
    color: var(--gold-deep); margin: 30px 4px 10px;
  }
  .card-head { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 14px; }
  .ico {
    flex: none; width: 42px; height: 42px; border-radius: 12px; background: var(--gold-soft);
    border: 1px solid var(--gold-line); display: grid; place-items: center; color: var(--gold-deep);
  }
  .ico svg { width: 22px; height: 22px; }
  h2 { margin: 0; font-size: 19px; line-height: 1.3; letter-spacing: -.01em; }
  h3 { margin: 18px 0 8px; font-size: 15px; letter-spacing: .02em; color: var(--ink-2); }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14.5px; }

  .status { display: flex; gap: 16px; align-items: center; padding: 20px; }

    flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--gold-line); color: var(--muted);
  }
